name: macOS OS E2E and release smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex/token-fire-improvement-v1

permissions:
  contents: read

jobs:
  os-e2e-build-launch-x86_64:
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-x86_64-release-smoke
          cache-on-failure: true
      - name: Install dependencies
        run: npm ci
      - name: Test frontend and deterministic Pixi render
        run: npm test
      - name: Verify release contract
        run: npm run release:check
      - name: Run native transparency, keyboard, Quiet and Replay E2E
        run: |
          mkdir -p artifacts/os-e2e
          bash scripts/os-e2e/macos.sh
      - name: Build unsigned x86_64 app and DMG
        run: npm run tauri -- build --target x86_64-apple-darwin --bundles app,dmg
      - name: Verify architecture, launch and DMG
        shell: bash
        run: |
          app_path="$(find src-tauri/target/x86_64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          executable_path="$app_path/Contents/MacOS/$executable_name"
          file "$executable_path" | grep -q 'x86_64'
          plutil -lint "$app_path/Contents/Info.plist"
          hdiutil verify "$dmg_path"

          launch_log="$RUNNER_TEMP/token-fire-macos-launch.log"
          "$executable_path" >"$launch_log" 2>&1 &
          app_pid=$!
          sleep 8
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$launch_log"
            echo "Installed application exited during launch smoke" >&2
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true
      - name: Upload unsigned app and DMG
        uses: actions/upload-artifact@v4
        with:
          name: token-fire-macos-x86_64-unsigned
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Upload macOS OS E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-fire-macos-os-e2e
          path: |
            artifacts/os-e2e/macos-report.jsonl
            ${{ runner.temp }}/token-fire-macos-os-e2e.jsonl
            ${{ runner.temp }}/token-fire-macos-os-e2e.stdout.log
            ${{ runner.temp }}/token-fire-macos-os-e2e.stderr.log
          if-no-files-found: warn
