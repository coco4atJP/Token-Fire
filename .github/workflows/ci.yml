name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: write

jobs:
  decision-audit-fix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/tauri-codex-diorama'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tauri-codex-diorama
      - name: Align Token accounting and decisions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new))
              elif new not in text:
                  raise SystemExit(f"expected text not found in {path}")

          replace(
              "src-tauri/src/codex/watcher.rs",
              "self.pending_token_delta = self.pending_token_delta.saturating_add(outcome.token_delta.min(100_000));",
              "self.pending_token_delta = self.pending_token_delta.saturating_add(outcome.token_delta);",
          )
          replace(
              "src/domain/world.ts",
              "world.tokenQueue = Math.min(160_000, world.tokenQueue + tokenDelta);",
              "world.tokenQueue = Math.min(Number.MAX_SAFE_INTEGER, world.tokenQueue + tokenDelta);",
          )

          decisions = Path("docs/DECISIONS.md")
          text = decisions.read_text()
          text = text.replace(
              "- Abort／Errorは`ZERO OUTPUT · FULL EMISSIONS`として成果なし・消費ありを残す\n",
              "- Abort／Errorは`ZERO OUTPUT · FULL EMISSIONS`として成果なし・消費ありを残す\n- `PLAY`中の手動焼却はToken由来の破壊ではない明示的な例外とし、`manualDamage`へ別計上する\n- 大量Tokenでも論理QueueやRust Adapterで切り捨てず、表示イベント側だけを集約する\n",
          )
          text = text.replace(
              "- 内部の大分類`factoryTier`は6段階ごとの最大5段階だが、体験の主役にはしない",
              "- 内部の大分類`factoryTier`は6成長段階ごとの4区分だが、体験の主役にはしない",
          )
          text = text.replace(
              "- Chaos: 約18〜30秒\n- Balanced: 約34〜56秒\n- Calm: 約52〜86秒",
              "- Chaos: 約12〜19秒\n- Balanced: 約34〜56秒\n- Calm: 約95〜156秒\n\nCountdown速度と次回Timerの両方へMode倍率を反映しているため、Calm／Chaosの差は意図的に大きい。初回だけは共通Timer 26をMode倍率で消費する。",
          )
          text = text.replace(
              "- 途中行buffer: 最大256KiB\n",
              "- 途中行buffer: 最大256KiB\n- 追跡開始後、更新から約60分経過したfileは追跡対象から除外\n- Token差分は切り捨てず`saturating_add`し、表示負荷はWorld Event側で抑える\n",
          )
          addition = '''

## D-018 — リアルタイム表示は有界にし、論理Tokenは欠落させない

**状態:** Accepted

### 決定

Tokenの会計値と、画面へ同時に出す表現量を分離する。Token差分と未処理燃料は現実的なJavaScript安全整数の範囲で全量保持し、イベント・粒子・1frameの処理回数だけを制限する。

### 現在のBackpressure

- World Event待ちQueue: 最大8件
- Particle: 最大480個
- 1 updateのToken燃焼Event生成: 最大3回
- 1 updateの伐採Event生成: 最大2回
- Rust側のToken累積: `u64::saturating_add`
- TypeScript側のToken Queue: `Number.MAX_SAFE_INTEGER`まで保持

### 帰結

大量Token時は演出が集約・遅延することがあるが、環境債務の論理値を表示都合で切り捨てない。Event Queueから溢れた個別演出は省略され得る。

## D-019 — Offline Recoveryは最大12時間の部分回復にする

**状態:** Accepted

### 決定

アプリ停止中も世界を完全停止させず、再起動時に最大12時間分だけ熱・汚染・水位・植林を回復させる。長期間閉じただけで環境債務や焼け跡が完全に消える設計にはしない。

### 現在の挙動

- 熱、汚染を時間に応じて低下
- 水位、雨を時間に応じて回復
- 燃焼中の木は再起動時に焦げ木へ確定
- 焦げ木は2.5時間経過後から苗木化
- 苗木は時間に応じて成長
- 累計Token、伐採数、事故、工場成長は減らさない

### 理由

Chillな自然回復と「使った痕跡が残る」長期世界を両立するため。
'''
          marker = "\n---\n\n## 変更時のチェック"
          if "## D-018 —" not in text:
              text = text.replace(marker, addition + marker)
          decisions.write_text(text)
          PY
      - name: Commit aligned files
        run: |
          if git diff --quiet; then
            echo "No alignment changes required"
            exit 0
          fi
          git config user.name "token-fire-agent"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/src/codex/watcher.rs src/domain/world.ts docs/DECISIONS.md
          git commit -m "fix: Token会計と意思決定記録を整合"
          git push origin HEAD:agent/tauri-codex-diorama

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee frontend-build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Check Tauri backend
        id: cargo-check
        shell: bash
        run: |
          set +e
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-check.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Test Codex parser
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            frontend-build.log
            cargo-check.log
          if-no-files-found: ignore