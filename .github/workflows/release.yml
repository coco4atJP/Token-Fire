name: Release desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "token-fire-v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: node scripts/release-preflight.mjs
      - run: npm test
      - run: npm run build

  macos-e2e:
    uses: ./.github/workflows/macos-release-smoke.yml

  windows-e2e:
    uses: ./.github/workflows/windows-release-smoke.yml

  publish:
    needs: verify
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - platform: macos-15
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - platform: windows-2025
            args: "--bundles msi,nsis"
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact }}
      - run: npm ci

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const notes = readFileSync(`docs/releases/v${version}.md`, 'utf8');
          const delimiter = randomUUID();
          appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n${notes}\n${delimiter}\n`);
          NODE

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 証明書を使わないad-hoc署名。Developer ID署名・公証ではない。
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-15' && '-' || '' }}
        with:
          tagName: token-fire-v__VERSION__
          releaseName: "Token Fire v__VERSION__ (unsigned preview)"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Verify ad-hoc macOS app and install from DMG
        if: matrix.platform == 'macos-15'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash scripts/release/verify-macos.sh

      - name: Verify unsigned Windows installers and lifecycle
        if: matrix.platform == 'windows-2025'
        shell: pwsh
        run: ./scripts/release/verify-windows.ps1

  checksums:
    needs: [publish, macos-e2e, windows-e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download draft installers and attach SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_tag="token-fire-v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          mkdir -p release-downloads
          gh release download "$release_tag" --dir release-downloads --pattern '*.dmg' --pattern '*.msi' --pattern '*-setup.exe'
          node scripts/release/checksums.mjs release-downloads
          gh release upload "$release_tag" release-downloads/SHA256SUMS --clobber
