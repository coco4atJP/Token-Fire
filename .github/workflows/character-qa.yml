name: Character QA

on:
  pull_request:
    branches: ["main"]

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/token-fire-vite.log 2>&1 &
          for i in {1..30}; do
            curl --silent --fail http://127.0.0.1:1420 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/token-fire-vite.log
          exit 1
      - name: Capture choreography states
        run: |
          mkdir -p character-qa
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const page = await browser.newPage({ viewport: { width: 560, height: 350 }, deviceScaleFactor: 1 });
          page.on("console", message => {
            if (message.type() === "error") errors.push(message.text());
          });
          page.on("pageerror", error => errors.push(error.message));
          await page.goto("http://127.0.0.1:1420", { waitUntil: "networkidle" });
          await page.waitForTimeout(2_000);
          await page.screenshot({ path: "character-qa/thinking-low.png" });
          await page.waitForTimeout(4_000);
          await page.screenshot({ path: "character-qa/working-medium.png" });
          await page.waitForTimeout(5_000);
          await page.screenshot({ path: "character-qa/working-high-two-agents.png" });
          await page.waitForTimeout(7_000);
          await page.screenshot({ path: "character-qa/working-xhigh-three-agents.png" });
          await page.waitForTimeout(9_000);
          await page.screenshot({ path: "character-qa/recovery.png" });
          const compact = await browser.newPage({ viewport: { width: 380, height: 240 }, deviceScaleFactor: 1 });
          compact.on("console", message => {
            if (message.type() === "error") errors.push(message.text());
          });
          compact.on("pageerror", error => errors.push(error.message));
          await compact.goto("http://127.0.0.1:1420", { waitUntil: "networkidle" });
          await compact.waitForTimeout(6_000);
          await compact.screenshot({ path: "character-qa/compact-working.png" });
          await browser.close();
          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: character-qa
          path: character-qa
          retention-days: 1
