name: Source Export

on:
  push:
    branches: ["agent/tauri-codex-diorama"]

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf token-fire-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: token-fire-source
          path: token-fire-source.tar.gz
          retention-days: 1
