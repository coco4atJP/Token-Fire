name: Visual QA

on:
  pull_request:

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/token-fire-vite.log 2>&1 &
          for i in {1..30}; do
            curl --silent --fail http://127.0.0.1:5173 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/token-fire-vite.log
          exit 1

      - name: Capture demo states
        run: |
          mkdir -p visual-qa
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const desktop = await browser.newPage({ viewport: { width: 560, height: 350 }, deviceScaleFactor: 1 });
          await desktop.goto("http://127.0.0.1:5173", { waitUntil: "networkidle" });
          await desktop.waitForTimeout(6_000);
          await desktop.screenshot({ path: "visual-qa/active-medium.png" });
          await desktop.waitForTimeout(12_000);
          await desktop.screenshot({ path: "visual-qa/active-xhigh.png" });
          await desktop.waitForTimeout(9_000);
          await desktop.screenshot({ path: "visual-qa/recovery.png" });

          const compact = await browser.newPage({ viewport: { width: 380, height: 240 }, deviceScaleFactor: 1 });
          await compact.goto("http://127.0.0.1:5173", { waitUntil: "networkidle" });
          await compact.waitForTimeout(6_000);
          await compact.screenshot({ path: "visual-qa/compact-active.png" });
          await browser.close();
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: visual-qa
          retention-days: 1
