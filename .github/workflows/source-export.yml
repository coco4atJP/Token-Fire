name: Source Export

on:
  push:
    branches: ["agent/tauri-codex-diorama"]

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: zip -qr token-fire-source.zip . -x '.git/*' 'node_modules/*' 'dist/*' 'src-tauri/target/*'
      - uses: actions/upload-artifact@v4
        with:
          name: token-fire-source
          path: token-fire-source.zip
          retention-days: 1
