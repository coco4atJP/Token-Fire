name: Audio Diagnostics

on:
  push:
    branches: ["agent/tauri-codex-diorama"]

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture build diagnostics
        run: npm run build > audio-build.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: audio-build-diagnostics
          path: audio-build.log
          retention-days: 1
